[package]
name = "mhreader"
version = "0.1.0"
description = "MHReader - Markdown reader & editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mhreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
